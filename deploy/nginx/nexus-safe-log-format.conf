# Include in http {}. Select nexus_safe in every site server, including redirects.
map $request_method $nexus_log_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
    CONNECT CONNECT;
    TRACE TRACE;
}
log_format nexus_safe '$remote_addr [$time_iso8601] "$nexus_log_method $server_protocol" '
                      '$status $body_bytes_sent "$request_id" $request_time';
