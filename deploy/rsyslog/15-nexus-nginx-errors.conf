# Requires the host's existing module(load="imuxsock").
# A dedicated socket/ruleset prevents raw messages reaching the system journal,
# default syslog file, forwarding rules or a disk-backed queue.
# Keep diagnostic metadata; never persist message text or request/header values.
template(name="NexusSafeError" type="string"
    string="%timereported:::date-rfc3339% %syslogseverity-text% nexus-nginx category=%$!nexus_category% exception=%$!nexus_exception% connection=%$!nexus_connection%\n")
ruleset(name="NexusSafeErrors") {
    set $!nexus_category = "nginx_error";
    if ($msg contains "PHP Fatal error" or $msg contains "PHP Parse error") then {
        set $!nexus_category = "php_fatal";
    } else if ($msg contains "PHP Warning") then {
        set $!nexus_category = "php_warning";
    } else if ($msg contains "upstream timed out") then {
        set $!nexus_category = "upstream_timeout";
    } else if ($msg contains "connect() failed") then {
        set $!nexus_category = "upstream_connect_failed";
    } else if ($msg contains "limiting requests") then {
        set $!nexus_category = "rate_limited";
    } else if ($msg contains "Permission denied") then {
        set $!nexus_category = "permission_denied";
    } else if ($msg contains "No such file or directory") then {
        set $!nexus_category = "file_not_found";
    }
    # Only fixed type names are retained: exception messages and Referer may
    # forge source locations. Never extract arbitrary paths or line numbers.
    set $!nexus_exception = "unknown";
    if ($msg contains "BindingResolutionException") then { set $!nexus_exception = "BindingResolutionException"; }
    else if ($msg contains "PDOException") then { set $!nexus_exception = "PDOException"; }
    else if ($msg contains "TypeError") then { set $!nexus_exception = "TypeError"; }
    else if ($msg contains "ValueError") then { set $!nexus_exception = "ValueError"; }
    else if ($msg contains "RuntimeException") then { set $!nexus_exception = "RuntimeException"; }
    else if ($msg contains "ErrorException") then { set $!nexus_exception = "ErrorException"; }
    set $!nexus_connection = re_extract($msg, "^[ ]*([[][a-z]+[]] )?[0-9]+#[0-9]+: [*]([0-9]+) ", 0, 2, "-");
    action(type="omfile" file="/var/log/nexusphp/nginx-error.log"
           template="NexusSafeError" fileCreateMode="0640")
    stop
}
input(type="imuxsock" Socket="/var/log/nginx/nexus-error.sock"
      CreatePath="on" RateLimit.Interval="0" Ruleset="NexusSafeErrors")
